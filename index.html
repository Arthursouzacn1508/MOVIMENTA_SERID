function numero(v){if(v===null||v===undefined||v==='')return '-';return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}function kg(v){return v===null||v===undefined?'-':numero(v)+' kg';}function perc(v){return v===null||v===undefined?'-':numero(v)+'%';}function diferenca(a,b){if(a===null||b===null||a===undefined||b===undefined)return '-';let d=b-a;let sinal=d>0?'+':'';return sinal+numero(d);}function mostrarInicio(){document.getElementById('app').innerHTML=`<div class='hero'><h1>MOVIMENTA SERIDÓ</h1><p>Desafio de evolução saudável</p></div><div class='container'><div class='section-title'>Visão Geral</div><div class='dashboard'><div class='stat-card'><small>Participantes</small><strong>${participantes.length}</strong></div><div class='stat-card'><small>Com acompanhamento</small><strong>${participantes.filter(p=>p.medicoes.length>0).length}</strong></div><div class='stat-card'><small>Projeto iniciado</small><strong>01/09/2026</strong></div></div><div class='section-title'>Participantes</div><div class='participants' id='listaParticipantes'></div></div><footer>MOVIMENTA SERIDÓ • Acompanhamento de evolução saudável</footer>`;const lista=document.getElementById('listaParticipantes');participantes.forEach((p,index)=>{let evolucao=(p.pesoInicial!==null&&p.pesoAtual!==null)?p.pesoAtual-p.pesoInicial:null;let card=document.createElement('div');card.className='participant-card';card.innerHTML=`<div class='participant-name'>${p.nome}</div><div class='participant-info'><div>Sexo: ${p.sexo||'-'}</div><div style='margin-top:6px'>Peso atual: <strong>${kg(p.pesoAtual)}</strong></div><div style='margin-top:6px'>Evolução: <strong>${evolucao===null?'-':numero(evolucao)+' kg'}</strong></div></div>`;card.onclick=()=>mostrarParticipante(index);lista.appendChild(card);});}let graficoPeso=null;let graficoGordura=null;function mostrarParticipante(index){const p=participantes[index];let evolucaoPeso=(p.pesoInicial!==null&&p.pesoAtual!==null)?p.pesoAtual
